<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Football Chat</title>
<style>
body {
    background-color: #2e2e2e;
    font-family: 'Arial', sans-serif;
    color: #fff;
    background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80');
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    margin: 0;
    padding: 0;
}

.header {
    text-align: center;
    padding: 20px;
    background-color: rgba(0, 0, 0, 0.5);
    font-size: 2em;
    color: #ffcc00;
    font-family: 'Impact', sans-serif;
}

/* Sign-up/login section */
.auth-section {
    max-width: 600px;
    margin: 10px auto;
    padding: 10px;
    background-color: rgba(0,0,0,0.6);
    border-radius: 10px;
    text-align: center;
}

#welcomeMessage {
    margin-top: 10px;
    font-size: 1.2em;
    color: #fff;
}

/* User and friends setup */
.username-section, .friends-section {
    max-width: 600px;
    margin: 20px auto;
    padding: 10px;
    background-color: rgba(0,0,0,0.6);
    border-radius: 10px;
    text-align: center;
}

.friends-section h3 {
    margin-top: 0;
}

#friendsList {
    list-style: none;
    padding: 0;
    max-height: 150px;
    overflow-y: auto;
    margin-top: 10px;
}

#friendsList li {
    padding: 5px;
    border-bottom: 1px solid #ffcc00;
}

/* Chat styles */
.chat-container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: rgba(0, 0, 0, 0.6);
    border-radius: 10px;
    border: 2px solid #ffcc00;
    height: 400px;
    overflow-y: auto;
}

.message {
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 5px;
}

.user-message {
    background-color: #4CAF50;
    color: #fff;
}

.bot-message {
    background-color: #ff6600;
    color: #fff;
}

.message-input {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    padding: 10px;
}
</style>
</head>
<body>

<div class="header">
    🏈 Welcome to the Chat! 🏈
</div>

<!-- Sign-up/Login -->
<div class="auth-section" id="authSection">
    <h3>Sign Up / Login</h3>
    <input type="text" id="signUpName" placeholder="Enter your username" />
    <button onclick="signUpOrLogin()">Sign Up / Login</button>
    <div id="welcomeMessage"></div>
</div>

<!-- Main app (hidden till login) -->
<div id="app" style="display:none;">
  <!-- Username display -->
  <div class="username-section" id="userSection">
      <div id="currentUsername"></div>
  </div>

  <!-- Friends List -->
  <div class="friends-section">
      <h3>Friends</h3>
      <input type="text" id="friendInput" placeholder="Add a friend's username" />
      <button onclick="addFriend()">Add Friend</button>
      <ul id="friendsList"></ul>
  </div>

  <!-- Chat Area -->
  <div class="chat-container" id="chat">
      <!-- Chat messages will appear here -->
  </div>

  <!-- Message Input -->
  <div class="message-input">
      <input type="text" id="userInput" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
// Load data from localStorage
let username = '';
let friends = [];
let chatHistory = [];

// Try to load existing user data
const storedUser = localStorage.getItem('chatUser');
const storedFriends = localStorage.getItem('chatFriends');
const storedChat = localStorage.getItem('chatHistory');

if (storedUser) {
    username = storedUser;
}
if (storedFriends) {
    friends = JSON.parse(storedFriends);
}
if (storedChat) {
    chatHistory = JSON.parse(storedChat);
}

// Show login prompt if no username
const authSection = document.getElementById('authSection');
const appSection = document.getElementById('app');

if (username) {
    // Already logged in
    document.getElementById('welcomeMessage').textContent = 'Welcome back, ' + username;
    showApp();
} else {
    // Show login/signup
    authSection.style.display = 'block';
}

function showApp() {
    authSection.style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('currentUsername').textContent = 'Your username: ' + username;

    // Load chat history
    chatHistory.forEach(msg => {
        const chatBox = document.getElementById('chat');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + (msg.type === 'user' ? 'user-message' : 'bot-message');
        msgDiv.innerHTML = `<strong>${msg.sender}:</strong> ${msg.text}`;
        chatBox.appendChild(msgDiv);
    });
    // Scroll to bottom
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

// Sign-up/login function
function signUpOrLogin() {
    const nameInput = document.getElementById('signUpName');
    const name = nameInput.value.trim();
    if (name) {
        username = name;
        localStorage.setItem('chatUser', username);
        document.getElementById('welcomeMessage').textContent = 'Welcome, ' + username + '!';
        showApp();
        nameInput.value = '';
    } else {
        alert('Please enter a username.');
    }
}

// Add friend
function addFriend() {
    const friendInput = document.getElementById('friendInput');
    const friendName = friendInput.value.trim();
    if (friendName && !friends.includes(friendName)) {
        friends.push(friendName);
        localStorage.setItem('chatFriends', JSON.stringify(friends));
        updateFriendsList();
        friendInput.value = '';
    }
}

// Update friends list display
function updateFriendsList() {
    const list = document.getElementById('friendsList');
    list.innerHTML = '';
    friends.forEach(friend => {
        const li = document.createElement('li');
        li.textContent = friend;
        list.appendChild(li);
    });
}

// Send message
function sendMessage() {
    const input = document.getElementById('userInput');
    const messageText = input.value.trim();
    if (!username) {
        alert('Please sign up or log in first!');
        return;
    }
    if (messageText === '') return;

    const chatBox = document.getElementById('chat');

    // User message
    const userMsg = {
        sender: username,
        text: messageText,
        type: 'user'
    };
    chatHistory.push(userMsg);
    localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
    const userDiv = document.createElement('div');
    userDiv.className = 'message user-message';
    userDiv.innerHTML = `<strong>${username}:</strong> ${messageText}`;
    chatBox.appendChild(userDiv);

    // Simulate a reply
    const replySender = (friends.length > 0 && Math.random() < 0.5) ? friends[Math.floor(Math.random() * friends.length)] : 'FootballBot';
    const replyText = replySender === 'FootballBot' ? 'Keep scoring!' : 'Nice play!';
    const botMsg = {
        sender: replySender,
        text: replyText,
        type: 'bot'
    };
    chatHistory.push(botMsg);
    localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
    const botDiv = document.createElement('div');
    botDiv.className = 'message bot-message';
    botDiv.innerHTML = `<strong>${replySender}:</strong> ${replyText}`;
    chatBox.appendChild(botDiv);

    // Scroll to bottom
    chatBox.scrollTop = chatBox.scrollHeight;
    input.value = '';
}
</script>

</body>
</html>
