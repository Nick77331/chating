<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Football Chat with Firebase</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
/* (Your styles here, same as before) */
body {
  background-color: #2e2e2e;
  font-family: 'Arial', sans-serif;
  color: #fff;
  background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80');
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  margin: 0;
  padding: 0;
}
.header {
  text-align: center;
  padding: 20px;
  background-color: rgba(0, 0, 0, 0.5);
  font-size: 2em;
  color: #ffcc00;
  font-family: 'Impact', sans-serif;
}
/* ... (rest of your styles) ... */
.auth-section {
  max-width: 600px;
  margin: 10px auto;
  padding: 10px;
  background-color: rgba(0,0,0,0.6);
  border-radius: 10px;
  text-align: center;
}
#authButtons button {
  margin: 5px;
}
#chatSection {
  display: none; /* Hidden until logged in */
}
</style>
</head>
<body>

<div class="header">
  🏈 Welcome to the Football Chat! 🏈
</div>

<!-- Firebase Authentication UI -->
<div class="auth-section" id="authSection">
  <h3>Sign Up / Login</h3>
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Password" />
  <div id="authButtons">
    <button onclick="signUp()">Sign Up</button>
    <button onclick="signIn()">Sign In</button>
    <button onclick="signOut()">Sign Out</button>
  </div>
  <div id="authStatus"></div>
</div>

<!-- Main Chat UI, hidden initially -->
<div id="chatSection">
  <div class="username-section" id="userDisplay"></div>
  <!-- Friends list, chat, message input similar as before -->
  <div class="friends-section">
    <h3>Friends</h3>
    <input type="text" id="friendInput" placeholder="Friend's username (email)" />
    <button onclick="addFriend()">Add Friend</button>
    <ul id="friendsList"></ul>
  </div>
  <div class="chat-container" id="chat"></div>
  <div class="message-input">
    <input type="text" id="userMessage" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  // Your Firebase config (replace with your own)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MSG_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  let currentUser = null;

  // Sign Up
  function signUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    auth.createUserWithEmailAndPassword(email, password)
      .then(userCredential => {
        currentUser = userCredential.user;
        localStorage.setItem('userEmail', currentUser.email);
        showChat();
        loadFriends();
        loadMessages();
      })
      .catch(error => alert(error.message));
  }

  // Sign In
  function signIn() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    auth.signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        currentUser = userCredential.user;
        localStorage.setItem('userEmail', currentUser.email);
        showChat();
        loadFriends();
        loadMessages();
      })
      .catch(error => alert(error.message));
  }

  // Sign Out
  function signOut() {
    auth.signOut().then(() => {
      currentUser = null;
      document.getElementById('chatSection').style.display = 'none';
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('authStatus').textContent = 'Signed out.';
    });
  }

  // Show chat UI
  function showChat() {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('chatSection').style.display = 'block';
    document.getElementById('userDisplay').textContent = 'Logged in as: ' + currentUser.email;
  }

  // Load friends from Firebase (example)
  function loadFriends() {
    // Your data structure might be different; here's an example
    const friendsRef = db.ref('users/' + encodeEmail(currentUser.email) + '/friends');
    friendsRef.on('value', snapshot => {
      const friendsData = snapshot.val() || {};
      const friendsList = Object.keys(friendsData);
      updateFriendsList(friendsList);
    });
  }

  // Helper to encode email to be used as Firebase key
  function encodeEmail(email) {
    return email.replace('.', ',');
  }

  // Add friend
  function addFriend() {
    const friendEmail = document.getElementById('friendInput').value.trim();
    if (!friendEmail) return;
    const friendsRef = db.ref('users/' + encodeEmail(currentUser.email) + '/friends');
    const newFriendRef = friendsRef.push();
    newFriendRef.set({ email: friendEmail });
  }

  // Update friends list display
  function updateFriendsList(friends) {
    const list = document.getElementById('friendsList');
    list.innerHTML = '';
    friends.forEach(friendEmail => {
      const li = document.createElement('li');
      li.textContent = friendEmail;
      list.appendChild(li);
    });
  }

  // Send message
  function sendMessage() {
    const msgInput = document.getElementById('userMessage');
    const messageText = msgInput.value.trim();
    if (!currentUser || !messageText) return;

    const messageRef = db.ref('messages');
    messageRef.push({
      sender: currentUser.email,
      text: messageText,
      timestamp: Date.now()
    });
    msgInput.value = '';
  }

  // Load messages in real-time
  function loadMessages() {
    const messagesRef = db.ref('messages');
    messagesRef.on('child_added', snapshot => {
      const msg = snapshot.val();
      displayMessage(msg);
    });
  }

  function displayMessage(msg) {
    const chatBox = document.getElementById('chat');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message ' + (msg.sender === currentUser.email ? 'user-message' : 'bot-message');
    msgDiv.innerHTML = `<strong>${msg.sender}:</strong> ${msg.text}`;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // Firebase auth state observer
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      showChat();
      loadFriends();
      loadMessages();
    }
  });
</script>

</body>
</html>
